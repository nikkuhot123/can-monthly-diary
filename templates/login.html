<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ERTHP6NKMS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-ERTHP6NKMS');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Audit Diary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h2>✦ Audit Diary</h2>
        <p style="text-align:center;font-size:0.85rem;color:#6b7280;margin-bottom:24px;">
            Sign in with your Google account
        </p>
        <div id="error-message" class="alert alert-danger d-none"></div>
        <button id="google-signin-btn" class="google-btn">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="white" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="white" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="white" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="white" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Sign in with Google
        </button>
        <div class="auth-footer">Secured with Firebase Authentication</div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {{ firebase_config | tojson | safe }};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

document.getElementById('google-signin-btn').addEventListener('click', async function() {
    const btn = this;
    const errorDiv = document.getElementById('error-message');
    errorDiv.classList.add('d-none');
    btn.disabled = true;
    btn.innerHTML = 'Signing in...';

    try {
        const result = await signInWithPopup(auth, provider);
        const idToken = await result.user.getIdToken();
        const resp = await fetch('/auth/google-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'id_token=' + encodeURIComponent(idToken)
        });

        // Guard: server may return HTML (502, 504, nginx error) instead of JSON
        const contentType = resp.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
            const text = await resp.text();
            console.error('Non-JSON response from server:', resp.status, text.substring(0, 200));
            errorDiv.textContent = `Server error (${resp.status}). Check server logs.`;
            errorDiv.classList.remove('d-none');
            btn.disabled = false;
            btn.innerHTML = 'Sign in with Google';
            return;
        }

        const data = await resp.json();
        if (data.needs_setup) {
            sessionStorage.setItem('temp_token', data.temp_token);
            sessionStorage.setItem('display_name', data.display_name || '');
            window.location.href = '/auth/setup?email=' + encodeURIComponent(data.email);
        } else if (data.redirect) {
            window.location.href = data.redirect;
        } else if (data.error) {
            errorDiv.textContent = data.error;
            errorDiv.classList.remove('d-none');
            btn.disabled = false;
            btn.innerHTML = 'Sign in with Google';
        }
    } catch (error) {
        if (error.code === 'auth/popup-closed-by-user') {
            btn.disabled = false;
            btn.innerHTML = 'Sign in with Google';
            return;
        }
        errorDiv.textContent = 'Sign-in failed: ' + error.message;
        errorDiv.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = 'Sign in with Google';
    }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
