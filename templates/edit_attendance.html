{% extends "base.html" %}
{% block title %}Edit Attendance{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Attendance</h1>
    <div class="page-header-actions">
        <a href="/attendance/calendar?diary_id={{ record.diary_id }}" class="btn btn-outline btn-sm">&larr; Back to Calendar</a>
    </div>
</div>

<div class="card">
    <form method="POST" action="/attendance/edit/{{ record.id }}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Date</label>
                <input class="form-input" type="date" name="duty_date" value="{{ record.duty_date }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Branch Name</label>
                <input class="form-input" type="text" name="branch_name" value="{{ record.branch_name or '' }}" placeholder="Branch name">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Duty From</label>
                <input class="form-input" type="time" name="duty_from_time" value="{{ record.duty_from_time or '09:00' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Duty To</label>
                <input class="form-input" type="time" name="duty_to_time" value="{{ record.duty_to_time or '18:00' }}">
            </div>
        </div>

        <div class="form-row-3">
            <div class="form-group">
                <label class="form-label">DP Code</label>
                <input class="form-input" type="text" name="dp_code" value="{{ record.dp_code or '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Audit Type</label>
                <input class="form-input" type="text" name="audit_type" value="{{ record.audit_type or '' }}" placeholder="e.g. SAI, Concurrent">
            </div>
            <div class="form-group">
                <label class="form-label">Place</label>
                <input class="form-input" type="text" name="place" value="{{ record.place or '' }}">
            </div>
        </div>

        <div class="form-row-4">
            <div class="form-group">
                <label class="form-label">Mandays Sanctioned</label>
                <input class="form-input" type="number" name="mandays_sanctioned" value="{{ record.mandays_sanctioned or 0 }}">
            </div>
            <div class="form-group">
                <label class="form-label">Mandays Utilised</label>
                <input class="form-input" type="number" name="mandays_utilised" value="{{ record.mandays_utilised or 0 }}">
            </div>
            <div class="form-group">
                <label class="form-label">Mandays Pending</label>
                <input class="form-input" type="number" name="mandays_pending" value="{{ record.mandays_pending or 0 }}">
            </div>
            <div class="form-group">
                <label class="form-label">Executive Mandays</label>
                <input class="form-input" type="number" name="executive_mandays" value="{{ record.executive_mandays or 0 }}">
            </div>
        </div>

        <div class="form-row" style="margin-bottom:20px;">
            <div class="form-group">
                <div class="toggle-wrapper">
                    <label class="toggle-switch">
                        <input type="checkbox" name="is_holiday" value="true" {% if record.is_holiday %}checked{% endif %}>
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="toggle-label">Is Holiday</span>
                </div>
            </div>
            <div class="form-group">
                <div class="toggle-wrapper">
                    <label class="toggle-switch">
                        <input type="checkbox" name="is_leave" value="true" {% if record.is_leave %}checked{% endif %}>
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="toggle-label">Is Leave</span>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary">Update Attendance</button>
            <a href="/attendance/calendar?diary_id={{ record.diary_id }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
