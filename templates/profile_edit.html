{% extends "base.html" %}
{% block title %}Edit Profile - Audit Diary{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Edit Profile</h2>
    <a href="/auth/profile" class="btn btn-outline">← Back to Profile</a>
</div>

<form method="POST" action="/auth/profile/edit" style="max-width:800px;">
    <div class="card mb-5">
        <h3 class="mb-4">Service Details</h3>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Designation</label>
                <input type="text" name="designation" class="form-input"
                       value="{{ user.designation or '' }}" placeholder="e.g. Audit Officer">
            </div>
            <div class="form-group">
                <label class="form-label">Designation Code</label>
                <input type="text" name="designation_code" class="form-input"
                       value="{{ user.designation_code or '' }}" placeholder="e.g. AO">
            </div>
            <div class="form-group">
                <label class="form-label">DP Code</label>
                <input type="text" name="dp_code" class="form-input"
                       value="{{ user.dp_code or '' }}" placeholder="e.g. 1234">
            </div>
            <div class="form-group">
                <label class="form-label">Section</label>
                <input type="text" name="section" class="form-input"
                       value="{{ user.section or '' }}" placeholder="e.g. Inspection">
            </div>
            <div class="form-group">
                <label class="form-label">Zone</label>
                <input type="text" name="zone" class="form-input"
                       value="{{ user.zone or '' }}" placeholder="e.g. Mumbai Zone">
            </div>
            <div class="form-group">
                <label class="form-label">Basic Pay (₹)</label>
                <input type="number" step="0.01" name="basic_pay" class="form-input"
                       value="{{ user.basic_pay or '' }}" placeholder="e.g. 56100">
            </div>
            <div class="form-group">
                <label class="form-label">Home State</label>
                <select name="home_state" class="form-select">
                    {% for s in all_states %}
                    <option value="{{ s }}" {{ 'selected' if user.home_state == s }}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">City Category</label>
                <select name="city_category" class="form-select">
                    {% for cat in ['X', 'Y', 'Z', 'A1', 'B1', 'B2', 'C', 'R'] %}
                    <option value="{{ cat }}" {{ 'selected' if user.city_category == cat }}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Mobile Number</label>
                <input type="tel" name="mobile" class="form-input"
                       value="{{ user.mobile or '' }}" placeholder="10-digit mobile number">
            </div>
        </div>
    </div>

    <div class="card mb-5">
        <h3 class="mb-3">Personal Details for Excel</h3>
        <p class="text-secondary mb-4" style="font-size:0.8rem;">
            Used when generating your TA bill Excel files.
        </p>
        <div class="form-row">
            <div class="form-group" style="grid-column:1/-1;">
                <label class="form-label">Address Line 1</label>
                <input type="text" name="address_line1" class="form-input"
                       value="{{ user.address_line1 or '' }}" placeholder="Flat/Room No., Building Name">
            </div>
            <div class="form-group" style="grid-column:1/-1;">
                <label class="form-label">Address Line 2</label>
                <input type="text" name="address_line2" class="form-input"
                       value="{{ user.address_line2 or '' }}" placeholder="Street/Locality">
            </div>
            <div class="form-group">
                <label class="form-label">City / PIN Code</label>
                <input type="text" name="city_pin" class="form-input"
                       value="{{ user.city_pin or '' }}" placeholder="e.g. NASHIK - 422011">
            </div>
            <div class="form-group">
                <label class="form-label">Bank Name</label>
                <input type="text" name="bank_name" class="form-input"
                       value="{{ user.bank_name or '' }}" placeholder="e.g. CANARA BANK">
            </div>
            <div class="form-group">
                <label class="form-label">Bank Account No.</label>
                <input type="text" name="bank_account_no" class="form-input"
                       value="{{ user.bank_account_no or '' }}" placeholder="e.g. 89641290000021">
            </div>
            <div class="form-group">
                <label class="form-label">TA ID</label>
                <input type="text" name="ta_id" class="form-input"
                       value="{{ user.ta_id or '' }}" placeholder="e.g. TA03224429">
            </div>
        </div>
    </div>

    <div class="flex gap-2" style="max-width:800px;">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="/auth/profile" class="btn btn-outline">Cancel</a>
        <button type="button" class="btn btn-danger" style="margin-left:auto;"
                onclick="if(confirm('Clear ALL personal details?')){document.getElementById('clearAllForm').submit();}">
            Clear All
        </button>
    </div>
</form>

<form id="clearAllForm" method="POST" action="/auth/profile/clear-all" style="display:none;"></form>
{% endblock %}
