{% extends "base.html" %}
{% block title %}Edit Profile - Audit Diary{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Edit Personal Details</h2>
    <a href="/auth/profile" class="pill-btn pill-outline">← Back to Profile</a>
</div>

<form method="POST" action="/auth/profile/edit" style="max-width:700px;">
    <div class="card-audit mb-4">
        <h5 class="mb-3" style="color:var(--color-gold);">Personal Details</h5>
        <p style="font-size:0.8rem;color:var(--color-muted);margin-bottom:16px;">
            These details will be used when generating your TA bill Excel files.
        </p>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="tel" name="mobile" class="form-control"
                       value="{{ user.mobile or '' }}" placeholder="10-digit mobile number">
            </div>
            <div class="col-md-12 mb-3">
                <label class="form-label">Address Line 1</label>
                <input type="text" name="address_line1" class="form-control"
                       value="{{ user.address_line1 or '' }}" placeholder="Flat/Room No., Building Name">
            </div>
            <div class="col-md-12 mb-3">
                <label class="form-label">Address Line 2</label>
                <input type="text" name="address_line2" class="form-control"
                       value="{{ user.address_line2 or '' }}" placeholder="Street/Locality">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">City / PIN Code</label>
                <input type="text" name="city_pin" class="form-control"
                       value="{{ user.city_pin or '' }}" placeholder="e.g. NASHIK - 422011">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Bank Name</label>
                <input type="text" name="bank_name" class="form-control"
                       value="{{ user.bank_name or '' }}" placeholder="e.g. CANARA BANK">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Bank Account No.</label>
                <input type="text" name="bank_account_no" class="form-control"
                       value="{{ user.bank_account_no or '' }}" placeholder="e.g. 89641290000021">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">TA ID</label>
                <input type="text" name="ta_id" class="form-control"
                       value="{{ user.ta_id or '' }}" placeholder="e.g. TA03224429">
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="pill-btn pill-gold">Save Details</button>
        <a href="/auth/profile" class="pill-btn pill-outline">Cancel</a>
        <button type="button" class="pill-btn pill-danger" style="margin-left:auto;"
                onclick="if(confirm('Clear ALL personal details?')){document.getElementById('clearAllForm').submit();}">
            Clear All
        </button>
    </div>
</form>

<form id="clearAllForm" method="POST" action="/auth/profile/clear-all" style="display:none;"></form>
{% endblock %}
