<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Account · Audit Diary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            font-family: 'Inter', sans-serif;
            padding: 24px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: card-in 0.4s ease forwards;
        }
        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-logo { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
        .auth-logo-icon { color: #f59e0b; }
        .auth-welcome { font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
        .auth-subtitle { font-size: 0.85rem; color: #64748b; margin-bottom: 4px; }
        .auth-footer { text-align: center; margin-top: 24px; font-size: 0.75rem; color: #94a3b8; }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <span class="auth-logo-icon">✦</span> Audit Diary
            </div>
        </div>

        <div class="auth-welcome">Complete Your Profile</div>
        <div class="auth-subtitle" style="margin-bottom:24px;">
            Enter your Employee ID and registered mobile number to get started. This is a one-time step.
        </div>

        {% if error %}
        <div class="alert alert-danger" style="font-size:0.82rem;padding:10px 14px;border-radius:8px;">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth/google-setup">
            <input type="hidden" name="temp_token" id="temp_token_input" value="{{ temp_token }}">

            <div class="form-group">
                <label class="form-label">Google Account</label>
                <input type="email" class="form-input" value="{{ request.query_params.email or '' }}" readonly style="background:#f8fafc;cursor:not-allowed;">
            </div>

            <div class="form-group">
                <label class="form-label" for="full_name_input">Your Full Name</label>
                <input type="text" name="full_name" id="full_name_input" class="form-input" required placeholder="As per official records" value="{{ display_name }}">
            </div>

            <div class="form-group">
                <label class="form-label" for="staff_no_input">Employee ID</label>
                <input type="text" name="staff_no" id="staff_no_input" class="form-input" required placeholder="Your 6-digit Employee ID">
            </div>

            <div class="form-group">
                <label class="form-label" for="mobile_input">Mobile Number</label>
                <input type="text" name="mobile" id="mobile_input" class="form-input" required placeholder="Your 10-digit mobile number">
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-full" style="margin-top:8px;">Link &amp; Continue</button>
        </form>

        <div class="auth-footer">Secured with Firebase Authentication</div>
    </div>

    <script>
        // Server pre-fills these from URL params; sessionStorage is fallback only
        const tokenInput = document.getElementById('temp_token_input');
        if (!tokenInput.value) {
            const ssToken = sessionStorage.getItem('temp_token');
            if (ssToken) tokenInput.value = ssToken;
        }
        const nameInput = document.getElementById('full_name_input');
        if (!nameInput.value) {
            const ssName = sessionStorage.getItem('display_name');
            if (ssName) nameInput.value = ssName;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
