<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Account - Audit Diary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h2>✦ Link Your Account</h2>
        <p style="text-align:center;font-size:0.85rem;color:#6b7280;margin-bottom:20px;">
            Connect your Google account to your staff profile
        </p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth/google-setup" class="form-audit">
            <input type="hidden" name="temp_token" id="temp_token_input">

            <div class="mb-3">
                <label>Google Account</label>
                <input type="email" class="form-control" value="{{ request.query_params.email or '' }}" readonly style="background:#f3f4f6;">
            </div>
            <div class="mb-3">
                <label>Staff Number</label>
                <input type="text" name="staff_no" class="form-control" required placeholder="Your 6-digit staff number">
            </div>
            <div class="mb-3">
                <label>Mobile Number</label>
                <input type="text" name="mobile" class="form-control" required placeholder="Your 10-digit mobile number">
            </div>
            <button type="submit" class="google-btn">Link &amp; Continue</button>
        </form>

        <div class="auth-footer">Secured with Firebase Authentication</div>
    </div>
</div>

<script>
    const token = sessionStorage.getItem('temp_token');
    if (token) document.getElementById('temp_token_input').value = token;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
