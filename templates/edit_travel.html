{% extends "base.html" %}
{% block title %}Edit Travel{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Edit Travel</h2>
    <a href="/travel/list/{{ leg.diary_id }}" class="pill-btn pill-outline">← Back to Travel</a>
</div>
<div class="card-audit" style="max-width:700px;">
    <form method="POST" action="/travel/edit/{{ leg.id }}" class="form-audit">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label>From Place</label>
                <input type="text" name="from_place" class="form-control" value="{{ leg.from_place }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>To Place</label>
                <input type="text" name="to_place" class="form-control" value="{{ leg.to_place }}" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Mode</label>
                <select name="mode" class="form-select">
                    <option value="Bus" {% if leg.mode == 'Bus' %}selected{% endif %}>Bus</option>
                    <option value="Train" {% if leg.mode == 'Train' %}selected{% endif %}>Train</option>
                    <option value="Airline" {% if leg.mode == 'Airline' %}selected{% endif %}>Airline</option>
                    <option value="Taxi" {% if leg.mode == 'Taxi' %}selected{% endif %}>Taxi</option>
                    <option value="Own Vehicle" {% if leg.mode == 'Own Vehicle' %}selected{% endif %}>Own Vehicle</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label>Start Date</label>
                <input type="date" name="date_start" class="form-control" value="{{ leg.date_start }}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label>Amount (₹)</label>
                <input type="number" step="0.01" name="claimed_amount_exc_gst" class="form-control" value="{{ leg.claimed_amount_exc_gst or 0 }}" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Travel Class</label>
                <input type="text" name="travel_class" class="form-control" value="{{ leg.travel_class or '' }}">
            </div>
            <div class="col-md-4 mb-3">
                <label>GST Percent</label>
                <input type="number" step="0.01" name="gst_percent" class="form-control" value="{{ leg.gst_percent or 0 }}">
            </div>
            <div class="col-md-4 mb-3">
                <label>Vendor GSTIN</label>
                <input type="text" name="vendor_gstin" class="form-control" value="{{ leg.vendor_gstin or '' }}">
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Distance (km)</label>
                <input type="number" step="0.1" name="distance_km" class="form-control" value="{{ leg.distance_km or 0 }}">
            </div>
            <div class="col-md-4 mb-3">
                <label>Ticket No</label>
                <input type="text" name="ticket_no" class="form-control" value="{{ leg.ticket_no or '' }}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="d-block">&nbsp;</label>
                <label class="toggle-switch" style="margin-top:8px;">
                    <input type="checkbox" name="no_bill" value="true" {% if leg.no_bill %}checked{% endif %}>
                    <span class="toggle-slider"></span>
                    <span style="margin-left:8px;font-size:0.8rem;">No Bill</span>
                </label>
            </div>
        </div>
        <div style="display:flex;gap:8px;">
            <button type="submit" class="pill-btn pill-primary">Update</button>
            <a href="/travel/list/{{ leg.diary_id }}" class="pill-btn pill-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
