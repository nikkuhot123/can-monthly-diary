{% extends "base.html" %}
{% block title %}Add Bill{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Bill</h1>
    <div class="page-header-actions">
        <a href="/bills/list/{{ diary.id }}" class="btn btn-outline btn-sm">← Back to Bills</a>
    </div>
</div>
<div class="card" style="max-width:640px;">
    <form method="POST" action="/bills/add/{{ diary.id }}" enctype="multipart/form-data">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Vendor Name</label>
                <input type="text" name="vendor_name" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Bill Category</label>
                <select name="bill_category" class="form-select" required>
                    <option value="hotel">Hotel</option>
                    <option value="travel">Travel</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Invoice Date</label>
                <input type="date" name="invoice_date" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Invoice Number</label>
                <input type="text" name="invoice_number" class="form-input">
            </div>
        </div>
        <div class="form-row-3">
            <div class="form-group">
                <label class="form-label">Amount (excl GST ₹)</label>
                <input type="number" step="0.01" name="amount_exc_gst" class="form-input" value="0">
            </div>
            <div class="form-group">
                <label class="form-label">GST Percent</label>
                <input type="number" step="0.01" name="gst_percent" class="form-input" value="0">
            </div>
            <div class="form-group">
                <label class="form-label">Total Amount (₹)</label>
                <input type="number" step="0.01" name="total_amount" class="form-input" value="0">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Vendor GSTIN</label>
                <input type="text" name="vendor_gstin" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Vendor State</label>
                <input type="text" name="vendor_state" class="form-input">
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Upload Bill File</label>
            <div class="dropzone" id="billDropzone">
                <div class="dropzone-icon">&#128196;</div>
                <div class="dropzone-text">Drop a bill file here or <strong>click to browse</strong></div>
                <div class="dropzone-filename" id="dropzoneFilename"></div>
                <input type="file" name="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png"
                       style="position:absolute;inset:0;opacity:0;cursor:pointer;">
            </div>
        </div>
        <div class="btn-group" style="margin-top:24px;">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/bills/list/{{ diary.id }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>

<script>
(function() {
    const dropZone = document.getElementById('billDropzone');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('dropzoneFilename');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, function(e) {
            e.preventDefault();
            e.stopPropagation();
        });
    });

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, function() {
            dropZone.classList.add('drag-over');
        });
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, function() {
            dropZone.classList.remove('drag-over');
        });
    });

    dropZone.addEventListener('drop', function(e) {
        const files = e.dataTransfer.files;
        if (files.length) {
            fileInput.files = files;
            updateFileState();
        }
    });

    fileInput.addEventListener('change', updateFileState);

    function updateFileState() {
        if (fileInput.files.length > 0) {
            fileName.textContent = fileInput.files[0].name;
        } else {
            fileName.textContent = '';
        }
    }
})();
</script>
{% endblock %}
