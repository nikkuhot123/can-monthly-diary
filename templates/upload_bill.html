{% extends "base.html" %}
{% block title %}Upload Bill{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Upload Bill</h2>
    <a href="/bills/list/{{ diary.id }}" class="btn btn-outline">← Back to Bills</a>
</div>

<div class="card" style="max-width:600px;">
    <form method="POST" action="/bills/upload/{{ diary.id }}" enctype="multipart/form-data" id="billUploadForm">
        <div class="mb-4">
            <label class="form-label" style="font-size:0.85rem;font-weight:600;">Bill Category</label>
            <select name="bill_category" class="form-select" required>
                <option value="hotel">Hotel</option>
                <option value="travel">Travel</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="form-label" style="font-size:0.85rem;font-weight:600;">Select Bill Image/PDF</label>
            <div class="dropzone" id="billDropZone">
                <div class="dropzone-icon">&#128196;</div>
                <div class="dropzone-text">
                    <strong>Click to browse</strong> or drag &amp; drop your bill here
                </div>
                <div class="dropzone-filename" id="billFileName" style="display:none;"></div>
                <input type="file" name="file" id="billFileInput" required
                       style="position:absolute;inset:0;opacity:0;cursor:pointer;">
            </div>
        </div>

        <div class="form-row mb-4">
            <div class="form-group">
                <label class="form-label">Vendor Name</label>
                <input type="text" name="vendor_name" class="form-input"
                       placeholder="Auto-filled from OCR" id="vendorName">
            </div>
            <div class="form-group">
                <label class="form-label">Amount (₹)</label>
                <input type="number" step="0.01" name="amount" class="form-input"
                       placeholder="Auto-filled from OCR" id="billAmount">
            </div>
            <div class="form-group">
                <label class="form-label">Bill Date</label>
                <input type="date" name="bill_date" class="form-input" id="billDate">
            </div>
            <div class="form-group">
                <label class="form-label">Vendor GSTIN</label>
                <input type="text" name="vendor_gstin" class="form-input"
                       placeholder="Auto-filled from OCR" id="vendorGstin">
            </div>
        </div>

        <small class="text-tertiary" style="display:block;margin-bottom:16px;">
            Upload a scanned bill or receipt. Fields may be auto-filled from OCR if available.
        </small>

        <button type="submit" class="btn btn-primary" id="saveBillBtn">Save Bill</button>
    </form>
</div>

<script>
(function() {
    const dropZone = document.getElementById('billDropZone');
    const fileInput = document.getElementById('billFileInput');
    const fileName = document.getElementById('billFileName');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, function(e) {
            e.preventDefault();
            e.stopPropagation();
        });
    });

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, function() {
            dropZone.classList.add('drag-over');
        });
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, function() {
            dropZone.classList.remove('drag-over');
        });
    });

    dropZone.addEventListener('drop', function(e) {
        const files = e.dataTransfer.files;
        if (files.length) {
            fileInput.files = files;
            updateFileState();
        }
    });

    fileInput.addEventListener('change', updateFileState);

    function updateFileState() {
        if (fileInput.files.length > 0) {
            fileName.textContent = fileInput.files[0].name;
            fileName.style.display = 'block';
        } else {
            fileName.style.display = 'none';
        }
    }

    dropZone.addEventListener('click', function() {
        fileInput.click();
    });
})();
</script>
{% endblock %}
