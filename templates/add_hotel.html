{% extends "base.html" %}
{% block title %}Add Hotel{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Hotel</h1>
    <div class="page-header-actions">
        <a href="/hotel/list/{{ diary.id }}" class="btn btn-outline btn-sm">← Back to Hotels</a>
    </div>
</div>
<div class="card" style="max-width:720px;">
    <form method="POST" action="/hotel/add/{{ diary.id }}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Hotel Name</label>
                <input type="text" name="hotel_name" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">City</label>
                <input type="text" name="city" class="form-input" required>
            </div>
        </div>
        <div class="form-row-3">
            <div class="form-group">
                <label class="form-label">Check In Date</label>
                <input type="date" name="checkin_date" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Check In Time</label>
                <input type="time" name="checkin_time" class="form-input" value="12:00">
            </div>
            <div class="form-group">
                <label class="form-label">Hotel Type</label>
                <select name="hotel_type" class="form-select">
                    <option value="ThreeStar">Three Star</option>
                    <option value="FourStar">Four Star</option>
                    <option value="FiveStar">Five Star</option>
                    <option value="Budget">Budget</option>
                </select>
            </div>
        </div>
        <div class="form-row-3">
            <div class="form-group">
                <label class="form-label">Check Out Date</label>
                <input type="date" name="checkout_date" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Check Out Time</label>
                <input type="time" name="checkout_time" class="form-input" value="12:00">
            </div>
            <div class="form-group">
                <label class="form-label">GST Percent</label>
                <input type="number" step="0.01" name="gst_percent" class="form-input" value="12.0">
            </div>
        </div>
        <div class="form-row-3">
            <div class="form-group">
                <label class="form-label">Lodging Amount (₹)</label>
                <input type="number" step="0.01" name="lodging_amount" class="form-input" value="0">
            </div>
            <div class="form-group">
                <label class="form-label">Boarding Amount (₹)</label>
                <input type="number" step="0.01" name="boarding_amount" class="form-input" value="0">
            </div>
            <div class="form-group">
                <label class="form-label">Vendor GSTIN</label>
                <input type="text" name="vendor_gstin" class="form-input">
            </div>
        </div>
        <div class="form-row-3">
            <div class="form-group">
                <label class="form-label">Invoice Date</label>
                <input type="date" name="invoice_date" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Invoice Number</label>
                <input type="text" name="invoice_number" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">&nbsp;</label>
                <div class="toggle-wrapper">
                    <label class="toggle-switch">
                        <input type="checkbox" name="no_bill" value="true">
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="toggle-label">No Bill</span>
                </div>
            </div>
        </div>
        <div class="btn-group" style="margin-top:24px;">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/hotel/list/{{ diary.id }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
