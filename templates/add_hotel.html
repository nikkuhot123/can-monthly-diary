{% extends "base.html" %}
{% block title %}Add Hotel{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Add Hotel</h2>
    <a href="/hotel/list/{{ diary.id }}" class="pill-btn pill-outline">← Back to Hotels</a>
</div>
<div class="card-audit" style="max-width:700px;">
    <form method="POST" action="/hotel/add/{{ diary.id }}" class="form-audit">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Hotel Name</label>
                <input type="text" name="hotel_name" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>City</label>
                <input type="text" name="city" class="form-control" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Check In Date</label>
                <input type="date" name="checkin_date" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label>Check In Time</label>
                <input type="time" name="checkin_time" class="form-control" value="12:00">
            </div>
            <div class="col-md-4 mb-3">
                <label>Hotel Type</label>
                <select name="hotel_type" class="form-select">
                    <option value="ThreeStar">Three Star</option>
                    <option value="FourStar">Four Star</option>
                    <option value="FiveStar">Five Star</option>
                    <option value="Budget">Budget</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Check Out Date</label>
                <input type="date" name="checkout_date" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label>Check Out Time</label>
                <input type="time" name="checkout_time" class="form-control" value="12:00">
            </div>
            <div class="col-md-4 mb-3">
                <label>GST Percent</label>
                <input type="number" step="0.01" name="gst_percent" class="form-control" value="12.0">
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Lodging Amount (₹)</label>
                <input type="number" step="0.01" name="lodging_amount" class="form-control" value="0">
            </div>
            <div class="col-md-4 mb-3">
                <label>Boarding Amount (₹)</label>
                <input type="number" step="0.01" name="boarding_amount" class="form-control" value="0">
            </div>
            <div class="col-md-4 mb-3">
                <label>Vendor GSTIN</label>
                <input type="text" name="vendor_gstin" class="form-control">
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Invoice Date</label>
                <input type="date" name="invoice_date" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
                <label>Invoice Number</label>
                <input type="text" name="invoice_number" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
                <label class="d-block">&nbsp;</label>
                <label class="toggle-switch" style="margin-top:8px;">
                    <input type="checkbox" name="no_bill" value="true">
                    <span class="toggle-slider"></span>
                    <span style="margin-left:8px;font-size:0.8rem;">No Bill</span>
                </label>
            </div>
        </div>
        <div style="display:flex;gap:8px;">
            <button type="submit" class="pill-btn pill-primary">Save</button>
            <a href="/hotel/list/{{ diary.id }}" class="pill-btn pill-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
