{% extends "base.html" %}
{% block title %}Add Travel{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Travel</h1>
    <div class="page-header-actions">
        <a href="/travel/list/{{ diary.id }}" class="btn btn-outline btn-sm">← Back to Travel</a>
    </div>
</div>
<div class="card" style="max-width:720px;">
    <form method="POST" action="/travel/add/{{ diary.id }}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">From Place</label>
                <input type="text" name="from_place" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">To Place</label>
                <input type="text" name="to_place" class="form-input" required>
            </div>
        </div>
        <div class="form-row-3">
            <div class="form-group">
                <label class="form-label">Mode</label>
                <select name="mode" class="form-select">
                    <option value="Bus">Bus</option>
                    <option value="Train">Train</option>
                    <option value="Airline">Airline</option>
                    <option value="Taxi">Taxi</option>
                    <option value="Own Vehicle">Own Vehicle</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Start Date</label>
                <input type="date" name="date_start" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Amount (₹)</label>
                <input type="number" step="0.01" name="claimed_amount_exc_gst" class="form-input" required>
            </div>
        </div>
        <div class="form-row-3">
            <div class="form-group">
                <label class="form-label">Travel Class</label>
                <input type="text" name="travel_class" class="form-input" placeholder="e.g. AC, Sleeper">
            </div>
            <div class="form-group">
                <label class="form-label">GST Percent</label>
                <input type="number" step="0.01" name="gst_percent" class="form-input" value="0">
            </div>
            <div class="form-group">
                <label class="form-label">Vendor GSTIN</label>
                <input type="text" name="vendor_gstin" class="form-input">
            </div>
        </div>
        <div class="form-row-4">
            <div class="form-group">
                <label class="form-label">Distance (km)</label>
                <input type="number" step="0.1" name="distance_km" class="form-input" value="0">
            </div>
            <div class="form-group">
                <label class="form-label">Ticket No</label>
                <input type="text" name="ticket_no" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">&nbsp;</label>
                <div class="toggle-wrapper">
                    <label class="toggle-switch">
                        <input type="checkbox" name="no_bill" value="true">
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="toggle-label">No Bill</span>
                </div>
            </div>
        </div>
        <div class="btn-group" style="margin-top:24px;">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/travel/list/{{ diary.id }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
