{% extends "base.html" %}
{% block title %}Add Local Conveyance{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Local Conveyance</h1>
    <div class="page-header-actions">
        <a href="/local/list/{{ diary.id }}" class="btn btn-outline btn-sm">← Back to Local</a>
    </div>
</div>
<div class="card" style="max-width:640px;">
    <form method="POST" action="/local/add/{{ diary.id }}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">From Place</label>
                <input type="text" name="from_place" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">To Place</label>
                <input type="text" name="to_place" class="form-input" required>
            </div>
        </div>
        <div class="form-row-4">
            <div class="form-group">
                <label class="form-label">Mode</label>
                <select name="mode" class="form-select">
                    <option value="Bus">Bus</option>
                    <option value="Taxi">Taxi</option>
                    <option value="Auto">Auto</option>
                    <option value="Own Vehicle">Own Vehicle</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Distance (km)</label>
                <input type="number" step="0.1" name="distance_km" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Date</label>
                <input type="date" name="travel_date" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Amount (₹)</label>
                <input type="number" step="0.01" name="claimed_amount_exc_gst" class="form-input" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">GST Percent</label>
                <input type="number" step="0.01" name="gst_percent" class="form-input" value="0">
            </div>
            <div class="form-group">
                <label class="form-label">Vendor GSTIN</label>
                <input type="text" name="vendor_gstin" class="form-input">
            </div>
        </div>
        <div class="btn-group" style="margin-top:24px;">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/local/list/{{ diary.id }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
