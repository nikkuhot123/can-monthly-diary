{% extends "base.html" %}
{% block title %}Edit Bill{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Bill</h1>
    <div class="page-header-actions">
        <a href="/bills/list/{{ bill.diary_id }}" class="btn btn-outline btn-sm">← Back to Bills</a>
    </div>
</div>
<div class="card" style="max-width:640px;">
    <form method="POST" action="/bills/edit/{{ bill.id }}" enctype="multipart/form-data">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Vendor Name</label>
                <input type="text" name="vendor_name" class="form-input" value="{{ bill.vendor_name or '' }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Bill Category</label>
                <select name="bill_category" class="form-select" required>
                    <option value="hotel" {% if bill.bill_category == 'hotel' %}selected{% endif %}>Hotel</option>
                    <option value="travel" {% if bill.bill_category == 'travel' %}selected{% endif %}>Travel</option>
                    <option value="other" {% if bill.bill_category == 'other' %}selected{% endif %}>Other</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Invoice Date</label>
                <input type="date" name="invoice_date" class="form-input" value="{{ bill.invoice_date or '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Invoice Number</label>
                <input type="text" name="invoice_number" class="form-input" value="{{ bill.invoice_number or '' }}">
            </div>
        </div>
        <div class="form-row-3">
            <div class="form-group">
                <label class="form-label">Amount (excl GST ₹)</label>
                <input type="number" step="0.01" name="amount_exc_gst" class="form-input" value="{{ bill.amount_exc_gst or 0 }}">
            </div>
            <div class="form-group">
                <label class="form-label">GST Percent</label>
                <input type="number" step="0.01" name="gst_percent" class="form-input" value="{{ bill.gst_percent or 0 }}">
            </div>
            <div class="form-group">
                <label class="form-label">Total Amount (₹)</label>
                <input type="number" step="0.01" name="total_amount" class="form-input" value="{{ bill.total_amount or 0 }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Vendor GSTIN</label>
                <input type="text" name="vendor_gstin" class="form-input" value="{{ bill.vendor_gstin or '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Vendor State</label>
                <input type="text" name="vendor_state" class="form-input" value="{{ bill.vendor_state or '' }}">
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Upload Bill File</label>
            <div class="dropzone" id="billDropzone" onclick="document.getElementById('fileInput').click()">
                <div class="dropzone-icon">&#128196;</div>
                <div class="dropzone-text">Drop a bill file here or <strong>click to browse</strong></div>
                <div class="dropzone-filename" id="dropzoneFilename">{% if bill.file_name %}Current: {{ bill.file_name }}{% endif %}</div>
            </div>
            <input type="file" name="file" id="fileInput" class="form-input" style="display:none;" accept=".pdf,.jpg,.jpeg,.png" data-current-filename="{{ bill.file_name or '' }}" onchange="document.getElementById('dropzoneFilename').textContent = this.files[0]?.name || (this.dataset.currentFilename ? 'Current: ' + this.dataset.currentFilename : '')">
        </div>
        <div class="btn-group" style="margin-top:24px;">
            <button type="submit" class="btn btn-primary">Update</button>
            <a href="/bills/list/{{ bill.diary_id }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
