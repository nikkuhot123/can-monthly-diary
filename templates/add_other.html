{% extends "base.html" %}
{% block title %}Add Other Expense{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Other Expense</h1>
    <div class="page-header-actions">
        <a href="/other/list/{{ diary.id }}" class="btn btn-outline btn-sm">← Back to Other</a>
    </div>
</div>
<div class="card" style="max-width:640px;">
    <form method="POST" action="/other/add/{{ diary.id }}">
        <div class="form-group">
            <label class="form-label">Description</label>
            <input type="text" name="expense_description" class="form-input" required>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Invoice Date</label>
                <input type="date" name="invoice_date" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Amount (₹ excl GST)</label>
                <input type="number" step="0.01" name="claimed_amount_exc_gst" class="form-input" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">GST Percent</label>
                <input type="number" step="0.01" name="gst_percent" class="form-input" value="0">
            </div>
            <div class="form-group">
                <label class="form-label">Declaration Amount (₹)</label>
                <input type="number" step="0.01" name="declaration_amount" class="form-input" value="0">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Vendor GSTIN</label>
                <input type="text" name="vendor_gstin" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Invoice Number</label>
                <input type="text" name="invoice_number" class="form-input">
            </div>
        </div>
        <div class="btn-group" style="margin-top:24px;">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/other/list/{{ diary.id }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
