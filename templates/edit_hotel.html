{% extends "base.html" %}
{% block title %}Edit Hotel{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Edit Hotel</h2>
    <a href="/hotel/list/{{ stay.diary_id }}" class="pill-btn pill-outline">← Back to Hotels</a>
</div>
<div class="card-audit" style="max-width:700px;">
    <form method="POST" action="/hotel/edit/{{ stay.id }}" class="form-audit">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Hotel Name</label>
                <input type="text" name="hotel_name" class="form-control" value="{{ stay.hotel_name }}" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>City</label>
                <input type="text" name="city" class="form-control" value="{{ stay.city }}" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Check In Date</label>
                <input type="date" name="checkin_date" class="form-control" value="{{ stay.checkin_date }}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label>Check In Time</label>
                <input type="time" name="checkin_time" class="form-control" value="{{ stay.checkin_time or '12:00' }}">
            </div>
            <div class="col-md-4 mb-3">
                <label>Hotel Type</label>
                <select name="hotel_type" class="form-select">
                    <option value="ThreeStar" {% if stay.hotel_type == 'ThreeStar' %}selected{% endif %}>Three Star</option>
                    <option value="FourStar" {% if stay.hotel_type == 'FourStar' %}selected{% endif %}>Four Star</option>
                    <option value="FiveStar" {% if stay.hotel_type == 'FiveStar' %}selected{% endif %}>Five Star</option>
                    <option value="Budget" {% if stay.hotel_type == 'Budget' %}selected{% endif %}>Budget</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Check Out Date</label>
                <input type="date" name="checkout_date" class="form-control" value="{{ stay.checkout_date }}" required>
            </div>
            <div class="col-md-4 mb-3">
                <label>Check Out Time</label>
                <input type="time" name="checkout_time" class="form-control" value="{{ stay.checkout_time or '12:00' }}">
            </div>
            <div class="col-md-4 mb-3">
                <label>GST Percent</label>
                <input type="number" step="0.01" name="gst_percent" class="form-control" value="{{ stay.gst_percent or 12.0 }}">
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Lodging Amount (₹)</label>
                <input type="number" step="0.01" name="lodging_amount" class="form-control" value="{{ stay.lodging_amount or 0 }}">
            </div>
            <div class="col-md-4 mb-3">
                <label>Boarding Amount (₹)</label>
                <input type="number" step="0.01" name="boarding_amount" class="form-control" value="{{ stay.boarding_amount or 0 }}">
            </div>
            <div class="col-md-4 mb-3">
                <label>Vendor GSTIN</label>
                <input type="text" name="vendor_gstin" class="form-control" value="{{ stay.vendor_gstin or '' }}">
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label>Invoice Date</label>
                <input type="date" name="invoice_date" class="form-control" value="{{ stay.invoice_date or '' }}">
            </div>
            <div class="col-md-4 mb-3">
                <label>Invoice Number</label>
                <input type="text" name="invoice_number" class="form-control" value="{{ stay.invoice_number or '' }}">
            </div>
            <div class="col-md-4 mb-3">
                <label class="d-block">&nbsp;</label>
                <label class="toggle-switch" style="margin-top:8px;">
                    <input type="checkbox" name="no_bill" value="true" {% if stay.no_bill %}checked{% endif %}>
                    <span class="toggle-slider"></span>
                    <span style="margin-left:8px;font-size:0.8rem;">No Bill</span>
                </label>
            </div>
        </div>
        <div style="display:flex;gap:8px;">
            <button type="submit" class="pill-btn pill-primary">Update</button>
            <a href="/hotel/list/{{ stay.diary_id }}" class="pill-btn pill-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
