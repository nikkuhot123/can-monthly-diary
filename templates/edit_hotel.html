{% extends "base.html" %}
{% block title %}Edit Hotel{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Edit Hotel</h1>
    <div class="page-header-actions">
        <a href="/hotel/list/{{ stay.diary_id }}" class="btn btn-outline btn-sm">← Back to Hotels</a>
    </div>
</div>
<div class="card" style="max-width:720px;">
    <form method="POST" action="/hotel/edit/{{ stay.id }}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Hotel Name</label>
                <input type="text" name="hotel_name" class="form-input" value="{{ stay.hotel_name }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">City</label>
                <input type="text" name="city" class="form-input" value="{{ stay.city }}" required>
            </div>
        </div>
        <div class="form-row-3">
            <div class="form-group">
                <label class="form-label">Check In Date</label>
                <input type="date" name="checkin_date" class="form-input" value="{{ stay.checkin_date }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Check In Time</label>
                <input type="time" name="checkin_time" class="form-input" value="{{ stay.checkin_time or '12:00' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Hotel Type</label>
                <select name="hotel_type" class="form-select">
                    <option value="ThreeStar" {% if stay.hotel_type == 'ThreeStar' %}selected{% endif %}>Three Star</option>
                    <option value="FourStar" {% if stay.hotel_type == 'FourStar' %}selected{% endif %}>Four Star</option>
                    <option value="FiveStar" {% if stay.hotel_type == 'FiveStar' %}selected{% endif %}>Five Star</option>
                    <option value="Budget" {% if stay.hotel_type == 'Budget' %}selected{% endif %}>Budget</option>
                </select>
            </div>
        </div>
        <div class="form-row-3">
            <div class="form-group">
                <label class="form-label">Check Out Date</label>
                <input type="date" name="checkout_date" class="form-input" value="{{ stay.checkout_date }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Check Out Time</label>
                <input type="time" name="checkout_time" class="form-input" value="{{ stay.checkout_time or '12:00' }}">
            </div>
            <div class="form-group">
                <label class="form-label">GST Percent</label>
                <input type="number" step="0.01" name="gst_percent" class="form-input" value="{{ stay.gst_percent or 12.0 }}">
            </div>
        </div>
        <div class="form-row-3">
            <div class="form-group">
                <label class="form-label">Lodging Amount (₹)</label>
                <input type="number" step="0.01" name="lodging_amount" class="form-input" value="{{ stay.lodging_amount or 0 }}">
            </div>
            <div class="form-group">
                <label class="form-label">Boarding Amount (₹)</label>
                <input type="number" step="0.01" name="boarding_amount" class="form-input" value="{{ stay.boarding_amount or 0 }}">
            </div>
            <div class="form-group">
                <label class="form-label">Vendor GSTIN</label>
                <input type="text" name="vendor_gstin" class="form-input" value="{{ stay.vendor_gstin or '' }}">
            </div>
        </div>
        <div class="form-row-3">
            <div class="form-group">
                <label class="form-label">Invoice Date</label>
                <input type="date" name="invoice_date" class="form-input" value="{{ stay.invoice_date or '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Invoice Number</label>
                <input type="text" name="invoice_number" class="form-input" value="{{ stay.invoice_number or '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">&nbsp;</label>
                <div class="toggle-wrapper">
                    <label class="toggle-switch">
                        <input type="checkbox" name="no_bill" value="true" {% if stay.no_bill %}checked{% endif %}>
                        <span class="toggle-slider"></span>
                    </label>
                    <span class="toggle-label">No Bill</span>
                </div>
            </div>
        </div>
        <div class="btn-group" style="margin-top:24px;">
            <button type="submit" class="btn btn-primary">Update</button>
            <a href="/hotel/list/{{ stay.diary_id }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
